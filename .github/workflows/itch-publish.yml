name: Publish to Itch.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to publish to Itch.io
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: itch-publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      ITCH_GAME: do-not-panic-portfolio-viewer
      ITCH_USER: tuklusan
      ITCH_INSTALLER_CHANNEL: windows
      ITCH_SHA256_CHANNEL: windows-sha256
      ITCH_MD5_CHANNEL: windows-md5
      ITCH_VIRUSTOTAL_CHANNEL: windows-virustotal-report
      PACKAGE_DIR: build/windows
      DOWNLOAD_DIR: build/release-assets
      RELEASE_TAG_PATTERN: '^[A-Za-z0-9._-]+$'
      RELEASE_ASSET_WAIT_ATTEMPTS: 60
      RELEASE_ASSET_WAIT_SECONDS: 60
      # Development freeze is default-on for the 1.0 cycle. Set repository
      # variable DNPPV_RELEASE_DISTRIBUTION_FROZEN=false only when a maintainer
      # explicitly approves publishing release assets to Itch.io.
      DNPPV_RELEASE_DISTRIBUTION_FROZEN: ${{ vars.DNPPV_RELEASE_DISTRIBUTION_FROZEN || 'true' }}
      # Release asset contract: one public Windows installer, one matching SHA-256 file,
      # and one VirusTotal advisory report are published to the GitHub Release.
      BUTLER_VERSION: v15.27.0
      BUTLER_ASSET: butler-linux-amd64.zip
      BUTLER_SHA256: b78ca81ed566c2daa54d68b7e300dd32888168163212293909ce90f16e0ec75d
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # This guard must remain before release asset downloads and Butler uploads.
      - name: Enforce Distribution Freeze
        run: |
          set -euo pipefail
          echo "DNPPV_RELEASE_DISTRIBUTION_FROZEN='$DNPPV_RELEASE_DISTRIBUTION_FROZEN'"
          clean_frozen="$(printf '%s' "$DNPPV_RELEASE_DISTRIBUTION_FROZEN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ "$clean_frozen" != "false" ]; then
            echo "Itch.io publishing is frozen for the 1.0 development cycle." >&2
            echo "Set repository variable DNPPV_RELEASE_DISTRIBUTION_FROZEN=false only after explicit maintainer approval." >&2
            exit 1
          fi

      - name: Validate Itch Publish Inputs
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "Missing release tag. Use a published release event or provide workflow_dispatch.release_tag." >&2
            exit 1
          fi

          if ! [[ "$RELEASE_TAG" =~ $RELEASE_TAG_PATTERN ]]; then
            echo "Release tag '$RELEASE_TAG' contains unsupported characters. Allowed: letters, numbers, dot, underscore, and hyphen." >&2
            exit 1
          fi

      - name: Wait for Complete GitHub Release Asset Set
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$DOWNLOAD_DIR" "$PACKAGE_DIR"
          mkdir -p "$DOWNLOAD_DIR" "$PACKAGE_DIR"

          # The GitHub Release is created first, then the release script submits
          # the public installer URL to VirusTotal, waits for results, generates
          # virustotal-advisory-report.md, and uploads that report as a final
          # release asset. Itch publishing must not start until all of that is
          # complete.
          for ((attempt = 1; attempt <= RELEASE_ASSET_WAIT_ATTEMPTS; attempt++)); do
            attempt_dir="$DOWNLOAD_DIR/attempt-$attempt"
            rm -rf "$attempt_dir"
            mkdir -p "$attempt_dir"

            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$attempt_dir" \
              --pattern 'DoNotPanicPortfolioVisualizerSetup-*.exe' \
              --pattern 'DoNotPanicPortfolioVisualizerSetup-*.sha256.txt' \
              --pattern 'virustotal-advisory-report.md'; then
              mapfile -d '' attempt_installers < <(find "$attempt_dir" -maxdepth 1 -type f -name 'DoNotPanicPortfolioVisualizerSetup-*.exe' -print0)
              mapfile -d '' attempt_sha_files < <(find "$attempt_dir" -maxdepth 1 -type f -name 'DoNotPanicPortfolioVisualizerSetup-*.sha256.txt' -print0)
              mapfile -d '' attempt_vt_reports < <(find "$attempt_dir" -maxdepth 1 -type f -name 'virustotal-advisory-report.md' -print0)
              installer_count="${#attempt_installers[@]}"
              sha_count="${#attempt_sha_files[@]}"
              vt_count="${#attempt_vt_reports[@]}"

              if [ "$installer_count" -gt 1 ] || [ "$sha_count" -gt 1 ] || [ "$vt_count" -gt 1 ]; then
                echo "Release asset set is ambiguous. installer=$installer_count sha256=$sha_count virustotal=$vt_count" >&2
                find "$attempt_dir" -maxdepth 1 -type f -print >&2
                exit 1
              fi

              if [ "$installer_count" = "1" ] && [ "$sha_count" = "1" ] && [ "$vt_count" = "1" ]; then
                installer_name="$(basename "${attempt_installers[0]}")"
                tag_without_v="${RELEASE_TAG#v}"
                expected="$(awk '{print tolower($1)}' "${attempt_sha_files[0]}" | sed 's/^sha256://')"
                actual="$(sha256sum "${attempt_installers[0]}" | awk '{print tolower($1)}')"

                if [[ "$installer_name" != *"$tag_without_v"* ]]; then
                  echo "Waiting because installer '$installer_name' does not include release tag '$tag_without_v'." >&2
                elif [ ! -s "${attempt_installers[0]}" ] || [ ! -s "${attempt_sha_files[0]}" ] || [ ! -s "${attempt_vt_reports[0]}" ]; then
                  echo "Waiting because one or more release assets are present but still empty." >&2
                elif [ "$actual" != "$expected" ]; then
                  echo "Waiting because installer SHA-256 does not match the checksum asset yet." >&2
                else
                  rm -rf "$PACKAGE_DIR"
                  mkdir -p "$PACKAGE_DIR"
                  cp -a "$attempt_dir"/. "$PACKAGE_DIR"/
                  break
                fi
              else
                echo "Waiting for complete release asset set. attempt=$attempt installer=$installer_count sha256=$sha_count virustotal=$vt_count" >&2
              fi
            else
              echo "gh release download failed for attempt=$attempt release=$RELEASE_TAG; waiting before retry." >&2
            fi

            if [ "$attempt" -eq "$RELEASE_ASSET_WAIT_ATTEMPTS" ]; then
              echo "Release assets were not complete after $attempt attempts." >&2
              exit 1
            fi

            sleep "$RELEASE_ASSET_WAIT_SECONDS"
          done

      - name: Verify Release Asset Set
        run: |
          set -euo pipefail

          mapfile -d '' installers < <(find "$PACKAGE_DIR" -maxdepth 1 -type f -name 'DoNotPanicPortfolioVisualizerSetup-*.exe' -print0)
          mapfile -d '' sha_files < <(find "$PACKAGE_DIR" -maxdepth 1 -type f -name 'DoNotPanicPortfolioVisualizerSetup-*.sha256.txt' -print0)

          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one installer asset, found ${#installers[@]}." >&2
            find "$PACKAGE_DIR" -maxdepth 1 -type f -print >&2
            exit 1
          fi

          if [ ! -s "${installers[0]}" ]; then
            echo "Installer asset exists but is empty: ${installers[0]}" >&2
            exit 1
          fi

          if [ "${#sha_files[@]}" -ne 1 ]; then
            echo "Expected exactly one SHA-256 checksum asset, found ${#sha_files[@]}." >&2
            find "$PACKAGE_DIR" -maxdepth 1 -type f -print >&2
            exit 1
          fi

          if [ ! -s "${sha_files[0]}" ]; then
            echo "SHA-256 checksum asset exists but is empty: ${sha_files[0]}" >&2
            exit 1
          fi

          if [ ! -f "$PACKAGE_DIR/virustotal-advisory-report.md" ]; then
            echo "Missing virustotal-advisory-report.md release asset." >&2
            find "$PACKAGE_DIR" -maxdepth 1 -type f -print >&2
            exit 1
          fi

          installer_name="$(basename "${installers[0]}")"
          tag_without_v="${RELEASE_TAG#v}"
          if [[ "$installer_name" != *"$tag_without_v"* ]]; then
            echo "Installer '$installer_name' does not include release tag '$tag_without_v'." >&2
            exit 1
          fi

          if [ ! -s "$PACKAGE_DIR/virustotal-advisory-report.md" ]; then
            echo "VirusTotal advisory report exists but is empty." >&2
            exit 1
          fi

          {
            echo 'INSTALLER_PATH<<EOF'
            printf '%s\n' "${installers[0]}"
            echo 'EOF'
            echo 'SHA256_PATH<<EOF'
            printf '%s\n' "${sha_files[0]}"
            echo 'EOF'
            echo 'VIRUSTOTAL_PATH<<EOF'
            printf '%s\n' "$PACKAGE_DIR/virustotal-advisory-report.md"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Verify SHA-256 Checksum
        run: |
          set -euo pipefail
          expected="$(awk '{print tolower($1)}' "$SHA256_PATH" | sed 's/^sha256://')"
          actual="$(sha256sum "$INSTALLER_PATH" | awk '{print tolower($1)}')"

          if [ "$actual" != "$expected" ]; then
            echo "SHA-256 mismatch for $(basename "$INSTALLER_PATH")." >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi

      - name: Generate MD5 Checksum
        run: |
          set -euo pipefail
          installer_name="$(basename "$INSTALLER_PATH")"
          md5_path="$PACKAGE_DIR/${installer_name}.md5.txt"
          md5sum "$INSTALLER_PATH" | awk -v installer="$installer_name" '{ print $1 "  " installer }' > "$md5_path"
          {
            echo 'MD5_PATH<<EOF'
            printf '%s\n' "$md5_path"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: List Itch Package Contents
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            printf '%s %s bytes\n' "$(basename "$file")" "$(wc -c < "$file")"
          done < <(find "$PACKAGE_DIR" -maxdepth 1 -type f -print0) | sort

      - name: Install Butler CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/butler"
          butler_url="https://github.com/itchio/butler/releases/download/${BUTLER_VERSION}/${BUTLER_ASSET}"
          curl --fail --location --silent --show-error "$butler_url" --output "$RUNNER_TEMP/butler/butler.zip"
          echo "$BUTLER_SHA256  $RUNNER_TEMP/butler/butler.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/butler/butler.zip" -d "$RUNNER_TEMP/butler"
          butler_bin="$(find "$RUNNER_TEMP/butler" -type f -name butler -print -quit)"
          if [ -z "$butler_bin" ]; then
            echo "Downloaded Butler archive did not contain a butler executable." >&2
            exit 1
          fi

          chmod +x "$butler_bin"
          dirname "$butler_bin" >> "$GITHUB_PATH"

      - name: Push Installer and Advisory Files to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "Missing BUTLER_CREDENTIALS repository secret for Itch.io publishing." >&2
            exit 1
          fi

          echo "::add-mask::$BUTLER_API_KEY"
          butler version
          # Push single files, not the package directory. Butler serves single
          # file pushes as direct downloads on the itch.io web page; pushing the
          # whole directory would create an archive-style build/download.
          butler push "$INSTALLER_PATH" "$ITCH_USER/$ITCH_GAME:$ITCH_INSTALLER_CHANNEL" --userversion "$RELEASE_TAG"
          butler push "$SHA256_PATH" "$ITCH_USER/$ITCH_GAME:$ITCH_SHA256_CHANNEL" --userversion "$RELEASE_TAG"
          butler push "$MD5_PATH" "$ITCH_USER/$ITCH_GAME:$ITCH_MD5_CHANNEL" --userversion "$RELEASE_TAG"
          butler push "$VIRUSTOTAL_PATH" "$ITCH_USER/$ITCH_GAME:$ITCH_VIRUSTOTAL_CHANNEL" --userversion "$RELEASE_TAG"
